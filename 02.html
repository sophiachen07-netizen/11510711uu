<h1 style="text-align: center">銀狐</h1>
<p style="text-align: center"><img src="file:///C|/Users/User/Pictures/phpFPnwSC.jpg" width="454" height="278" alt=""/></p>
<h3 style="text-align: left">銀狐是赤狐的一種黑病變的變異體。銀狐有多種變異，包括全身黑色（除了尾巴末端是白色外）、藍灰色及兩側呈灰色。野生銀狐並不能與相同毛皮形態的繁殖，但卻能與一般的赤狐交配，而圈養的群落則可以與相同毛色的交配。</h3>
