<h1 style="text-align: center">北極狐</h1>
<p style="text-align: center"><img src="file:///C|/Users/User/Pictures/images (1).jpg" width="463" height="282" alt=""/></p>
<h3>別名雪狐或白狐，在寒冷的北極凍原地區是常見的小型犬科動物，由於其毛皮是市場上的高檔貨，因此成了人們競相獵捕的目標。</h3>
<h3>北極狐的食物包括旅鼠、魚、鳥類與鳥蛋、漿果、北極兔，有時也會漫遊海岸捕捉貝類，但北極狐主食還是旅鼠。當北極狐聞到在旅鼠窩的氣味或聽到旅鼠窩裡旅鼠的尖叫聲時，牠會迅速地挖掘位於雪下面的旅鼠窩，當扒得差不多時，北極狐會高高跳起，藉著躍起的力量，用腿將旅鼠窩壓塌，然後將窩裡的旅鼠一網打盡。在極度飢餓的情況下，北極狐會自相攻擊。</h3>
