<h1 style="text-align: center">耳廓狐</h1>
<p style="text-align: center"><img src="file:///C|/Users/User/Pictures/fennec-fox-hole.jpg.adapt_.945.1.jpg" width="518" height="321" alt=""/></p>
<h3>是一種分布於北非薩哈拉的小型夜行狐，以其不同尋常的大耳朵而聞名。耳廓狐是最小的犬科動物，其皮毛、耳和腎功能都適應了高溫缺水的沙漠環境。另外其聽力十分敏銳，足以感覺到地下獵物活動。</h3>
<h3>耳廓狐在野外可以存活大概10年，其主要天敵包括獰貓和非洲種的雕鴞。耳廓狐群會在沙中挖掘大約120平方米的洞穴以防護與居住，這些洞穴甚至會與其他耳廓狐群洞穴相連。目前無法精確測出耳廓狐種群數目，但由目擊估計該物種尚未面臨滅絕威脅。雖然常被分類為狐屬，耳廓狐的分類尚有爭議。北非原住民認為耳廓狐的皮毛是珍貴的，世界其他地方則認為耳廓狐是一種有異國情調的寵物。</h3>
